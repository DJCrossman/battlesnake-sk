name: Teardown AWS Deployment

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force removal (overrides retention policies)'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    name: 🗑️ Teardown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::866215694760:role/github-ci
          role-session-name: teardown-api-session
          aws-region: us-west-2
          output-credentials: true

      - name: Remove deployment
        run: |
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            npm run remove -- --force
          else
            npm run remove
          fi
