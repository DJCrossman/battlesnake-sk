<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Snake Pad</title>
<style>
  :root {
    --bg: #0e1014;
    --panel: #171a21;
    --line: #262b36;
    --text: #e6e8ee;
    --muted: #8a91a3;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --food: #f43f5e;
    --hazard: rgba(148, 163, 184, 0.28);
    --grid: #1c2029;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto;
    -webkit-user-select: none; user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #conn { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #conn::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  #conn.open::before { background: var(--ok); }
  #conn.connecting::before { background: var(--warn); }
  #mode {
    font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
  }
  #mode[data-mode="assist"] { color: var(--ok); }
  #mode[data-mode="manual"] { color: var(--warn); }
  #mode[data-mode="auto"] { color: #60a5fa; }
  #arm {
    display: none; text-align: center; padding: 8px; border-radius: 8px;
    background: #3b2f0b; border: 1px solid var(--warn); color: var(--warn); font-weight: 600;
  }
  #arm.shown { display: block; }
  #board-wrap { position: relative; width: 100%; aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 10px; background: var(--panel); }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 18px; pointer-events: none; text-align: center; padding: 16px;
  }
  #hold { height: 8px; border-radius: 4px; background: var(--panel); overflow: hidden; }
  #hold > div { height: 100%; width: 0; background: var(--ok); }
  #stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .stat b { display: block; font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
  .stat span { display: block; font-size: 17px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #help { color: var(--muted); font-size: 12px; text-align: center; }
  #flipper { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #flipper[hidden] { display: none; }
  #flipper button {
    font: inherit; font-weight: 600; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  }
  #flipper-link { color: var(--muted); }
  #flipper-link[data-link="connected"] { color: var(--ok); }
  #flipper-link[data-link="connecting"] { color: var(--warn); }
  #flipper-link[data-link="lost"] { color: var(--bad); }
  #flipper-unsupported { color: var(--muted); font-size: 12px; text-align: center; }
  /* 16px stops iOS from zooming the page when the field takes focus. */
  #keys { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; }
</style>
</head>
<body>
  <header>
    <div id="conn">offline</div>
    <div id="mode" data-mode="">—</div>
  </header>
  <div id="arm">Tap to arm the keyboard</div>
  <div id="board-wrap">
    <canvas id="board" width="660" height="660"></canvas>
    <div id="overlay">Waiting for a game…</div>
  </div>
  <div id="hold"><div></div></div>
  <div id="stats">
    <div class="stat"><b>Turn</b><span id="turn">—</span></div>
    <div class="stat"><b>Health</b><span id="health">—</span></div>
    <div class="stat"><b>Length</b><span id="length">—</span></div>
    <div class="stat"><b>Last move</b><span id="move">—</span><small id="source">&nbsp;</small></div>
    <div class="stat"><b>Round trip</b><span id="rtt">—</span></div>
    <div class="stat"><b>Last key via</b><span id="via">—</span></div>
  </div>
  <div id="help">Arrows / WASD steer · Space / Enter switches mode</div>
  <div id="flipper" hidden>
    <button id="flipper-connect" type="button">Connect Flipper screen</button>
    <span id="flipper-link" data-link="off">Flipper: off</span>
  </div>
  <div id="flipper-unsupported" hidden>The Flipper screen needs Chrome on Android over HTTPS.</div>
  <input id="keys" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
         spellcheck="false" inputmode="none" aria-hidden="true" tabindex="-1">
<script>
"use strict";
const token = decodeURIComponent(location.hash.slice(1));
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const holdBar = document.getElementById("hold").firstElementChild;
const keyField = document.getElementById("keys");

const KEY_BYTES = {
  ArrowUp: 0, ArrowDown: 1, ArrowLeft: 2, ArrowRight: 3,
  w: 0, s: 1, a: 2, d: 3, W: 0, S: 1, A: 2, D: 3,
  " ": 4, Enter: 4,
};
const TEXT_BYTES = { w: 0, s: 1, a: 2, d: 3, " ": 4 };
const STEPS = { up: [0, 1], down: [0, -1], left: [-1, 0], right: [1, 0] };
// An echo request goes out every 2 s; no reply for this long means the socket is dead.
const ECHO_DEADLINE_MS = 5000;

// The Flipper's BLE serial service (firmware targets/f7/ble_glue/services/serial_service*.{c,inc};
// the firmware stores the 128-bit UUIDs little-endian, these are the usual string forms).
const FLIPPER_NAME_PREFIX = "Board ";
const FLIPPER_SERVICE = "8fe5b3d5-2e7f-4a98-2a48-7acc60fe0000";
// The phone writes here (write, write without response; up to 486 bytes per value).
const FLIPPER_RX = "19ed82ae-ed21-4c9d-4145-228e62fe0000";
// The Flipper indicates its bytes here.
const FLIPPER_TX = "19ed82ae-ed21-4c9d-4145-228e61fe0000";
// Big-endian uint32: how many more bytes the Flipper will accept. Each write spends it; the
// Flipper notifies the full buffer size again only once it is spent to exactly 0 and drained.
const FLIPPER_FLOW = "19ed82ae-ed21-4c9d-4145-228e63fe0000";
// One write per chunk. 243 is the firmware's own characteristic chunk and fits the MTU it
// negotiates; 20 fits the 23-byte default MTU when a larger write is refused.
const FLIPPER_CHUNK = 243;
const FLIPPER_SMALL_CHUNK = 20;
// Cell codes on the Flipper, and which wins when several things share a cell.
const CELL = { empty: 0, food: 1, hazard: 2, myBody: 3, myHead: 4, otherBody: 5, otherHead: 6 };
const CELL_RANK = [0, 2, 1, 4, 6, 3, 5];
const MODE_BITS = { assist: 0, manual: 1, auto: 2 };

let socket = null;
let serverOnline = false;
let currentMode = "assist";
// What the Flipper should show; resent when the link, the mode or the server connection changes.
let flipperScreen = { state: null };
const flipper = {
  device: null,
  rx: null,
  link: "off",
  backoff: 1000,
  retry: null,
  chunk: FLIPPER_CHUNK,
  // Bytes the Flipper will still accept (Infinity if it does not publish flow control).
  credit: Infinity,
  creditArrived: null,
  writing: false,
  newestFrame: null,
};
let backoff = 500;
let unansweredEchoSince = null;
let rttMs = null;
let lastState = null;
let holdStart = 0;
let holdMs = 0;
let holding = false;

// ---- connection -------------------------------------------------------------

function connect() {
  if (!token) {
    setConn("", "no token in URL (#token)");
    return;
  }
  setConn("connecting", "connecting…");
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.binaryType = "arraybuffer";
  socket = ws;
  unansweredEchoSince = null;
  ws.onopen = () => ws.send(token);
  ws.onmessage = (event) => {
    if (typeof event.data === "string") {
      onFrame(JSON.parse(event.data));
    } else {
      const view = new DataView(event.data);
      if (view.byteLength >= 9 && view.getUint8(0) === 5) {
        unansweredEchoSince = null;
        rttMs = performance.now() - view.getFloat64(1);
        document.getElementById("rtt").textContent = rttMs.toFixed(0) + " ms";
      }
    }
  };
  ws.onclose = () => {
    if (socket === ws) reconnectLater();
  };
}

function reconnectLater() {
  socket = null;
  serverOnline = false;
  showOnFlipper({ ...flipperScreen, started: false });
  setConn("", "offline — retrying in " + (backoff / 1000).toFixed(1) + " s");
  setTimeout(connect, backoff);
  backoff = Math.min(backoff * 2, 8000);
}

function send(byte, via) {
  document.getElementById("via").textContent = via;
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(new Uint8Array([byte]));
}

setInterval(() => {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  if (unansweredEchoSince !== null && performance.now() - unansweredEchoSince > ECHO_DEADLINE_MS) {
    // The phone slept or changed network and the socket never noticed: drop it and start over.
    const dead = socket;
    reconnectLater();
    dead.close();
    return;
  }
  if (unansweredEchoSince === null) unansweredEchoSince = performance.now();
  const frame = new DataView(new ArrayBuffer(9));
  frame.setUint8(0, 5);
  frame.setFloat64(1, performance.now());
  socket.send(frame.buffer);
}, 2000);

function onFrame(frame) {
  switch (frame.t) {
    case "hello":
      backoff = 500;
      serverOnline = true;
      setConn("open", "connected");
      setMode(frame.mode);
      showOnFlipper({ ...flipperScreen, started: false });
      break;
    case "mode":
      setMode(frame.mode);
      break;
    case "start":
      document.getElementById("overlay").textContent = "";
      draw(frame.state);
      showOnFlipper({ state: frame.state, started: true });
      break;
    case "turn":
      document.getElementById("overlay").textContent = "";
      setMode(frame.mode);
      draw(frame.state);
      // The server's deadline started half a round trip before this frame arrived.
      holdStart = performance.now() - (rttMs ?? 0) / 2;
      holdMs = frame.hold_ms;
      holding = holdMs > 0;
      if (holding) requestAnimationFrame(animateHold); else holdBar.style.width = "0";
      showOnFlipper({ state: frame.state, holdMs: Math.max(0, holdMs - (rttMs ?? 0) / 2) });
      break;
    case "moved":
      holding = false;
      holdBar.style.width = "0";
      document.getElementById("move").textContent = frame.move;
      document.getElementById("source").textContent = frame.source;
      if (lastState && lastState.turn === frame.turn) {
        const next = advanceOurSnake(lastState, frame.move);
        draw(next);
        showOnFlipper({ state: next });
      }
      break;
    case "end":
      holding = false;
      holdBar.style.width = "0";
      draw(frame.state);
      document.getElementById("overlay").textContent = "Game over";
      showOnFlipper({ state: frame.state, over: true });
      break;
  }
}

function setConn(cls, text) {
  const el = document.getElementById("conn");
  el.className = cls;
  el.textContent = text;
}

function setMode(mode) {
  const el = document.getElementById("mode");
  el.dataset.mode = mode;
  el.textContent = mode;
  if (mode !== currentMode) {
    currentMode = mode;
    showOnFlipper({ ...flipperScreen, started: false });
  }
}

// Our snake as it is after the server's answer, so presses before the next turn frame aim from
// where the head really is. Other snakes stay put until that frame replaces everything.
function advanceOurSnake(state, move) {
  const [dx, dy] = STEPS[move];
  const you = state.you;
  const head = { x: you.head.x + dx, y: you.head.y + dy };
  const body = [head, ...you.body.slice(0, -1)];
  return {
    ...state,
    turn: state.turn + 1,
    you: { ...you, head, body },
    board: {
      ...state.board,
      snakes: state.board.snakes.map((s) => (s.id === you.id ? { ...s, head, body } : s)),
    },
  };
}

// ---- input ------------------------------------------------------------------

// Primary path. preventDefault also stops the key from inserting text into the hidden field,
// so a key handled here is never counted again by the text path.
document.addEventListener("keydown", (event) => {
  const byte = KEY_BYTES[event.key];
  if (byte === undefined || event.ctrlKey || event.metaKey || event.altKey) return;
  event.preventDefault();
  if (event.repeat) return;
  send(byte, "key");
});

// Fallback for iOS Safari when it stops delivering keydown from a Bluetooth keyboard that is
// also a pointing device (WebKit bugs 301563 / 290779): typed text still reaches a focused field.
keyField.addEventListener("beforeinput", (event) => {
  // A non-cancelable insertion (e.g. during composition) lands in the field; `input` handles it.
  if (!event.cancelable) return;
  event.preventDefault();
  for (const ch of event.data || "") {
    const byte = TEXT_BYTES[ch.toLowerCase()];
    if (byte !== undefined) send(byte, "text");
  }
});
keyField.addEventListener("input", () => {
  const text = keyField.value;
  keyField.value = "";
  for (const ch of text) {
    const byte = TEXT_BYTES[ch.toLowerCase()];
    if (byte !== undefined) send(byte, "text");
  }
});

// iOS only lets a page focus a field during a user gesture, so after a reload or a return to
// the tab the text path is dead until a tap. Say so instead of failing silently.
// While the Flipper is linked over its serial service the keyboard path is not in use.
function showArmHint() {
  document
    .getElementById("arm")
    .classList.toggle("shown", flipper.link !== "connected" && document.activeElement !== keyField);
}
keyField.addEventListener("focus", showArmHint);
keyField.addEventListener("blur", showArmHint);
document.addEventListener("click", () => keyField.focus({ preventScroll: true }));

// ---- board ------------------------------------------------------------------

function draw(state) {
  lastState = state;
  const board = state.board;
  const size = Math.min(canvas.width / board.width, canvas.height / board.height);
  const styles = getComputedStyle(document.documentElement);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = styles.getPropertyValue("--grid");
  for (let x = 0; x < board.width; x++) {
    for (let y = 0; y < board.height; y++) {
      if ((x + y) % 2 === 0) ctx.fillRect(x * size, (board.height - 1 - y) * size, size, size);
    }
  }

  ctx.fillStyle = styles.getPropertyValue("--hazard");
  for (const h of board.hazards || []) ctx.fillRect(h.x * size, (board.height - 1 - h.y) * size, size, size);

  ctx.fillStyle = styles.getPropertyValue("--food");
  for (const f of board.food || []) {
    ctx.beginPath();
    ctx.arc(f.x * size + size / 2, (board.height - 1 - f.y) * size + size / 2, size * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }

  const youId = state.you && state.you.id;
  const snakes = [...(board.snakes || [])].sort((a, b) => (a.id === youId) - (b.id === youId));
  for (const snake of snakes) {
    const mine = snake.id === youId;
    const colour = (snake.customizations && snake.customizations.color) || "#94a3b8";
    ctx.globalAlpha = mine ? 1 : 0.6;
    ctx.fillStyle = colour;
    const inset = mine ? size * 0.06 : size * 0.14;
    snake.body.forEach((p, i) => {
      if (i > 0 && p.x === snake.body[i - 1].x && p.y === snake.body[i - 1].y) return;
      ctx.fillRect(p.x * size + inset, (board.height - 1 - p.y) * size + inset, size - inset * 2, size - inset * 2);
    });
    const hx = snake.head.x * size;
    const hy = (board.height - 1 - snake.head.y) * size;
    if (mine) {
      ctx.globalAlpha = 1;
      ctx.lineWidth = Math.max(2, size * 0.1);
      ctx.strokeStyle = "#ffffff";
      ctx.strokeRect(hx + inset, hy + inset, size - inset * 2, size - inset * 2);
    }
    ctx.fillStyle = "#0e1014";
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(hx + size / 2, hy + size / 2, size * 0.1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  document.getElementById("turn").textContent = state.turn;
  if (state.you) {
    document.getElementById("health").textContent = state.you.health;
    document.getElementById("length").textContent = state.you.length ?? state.you.body.length;
  }
}

function animateHold() {
  if (!holding) return;
  const left = Math.max(0, 1 - (performance.now() - holdStart) / holdMs);
  holdBar.style.width = (left * 100).toFixed(1) + "%";
  holdBar.style.background = left > 0.5 ? "var(--ok)" : left > 0.2 ? "var(--warn)" : "var(--bad)";
  if (left > 0) requestAnimationFrame(animateHold);
}

// ---- Flipper screen: Web Bluetooth bridge to the Flipper's serial service ------------------
//
// Flipper → page: single bytes 0..=4, forwarded to the server like key presses.
// Page → Flipper: frames of 0x53, a little-endian payload length, then the payload (flags,
// width, height, turn lo/hi, health, length, hold in 10 ms units, then one nibble per cell from
// the top row down), mirroring every board the canvas draws.

// Web Bluetooth only exists in secure contexts (HTTPS or localhost) in Chromium browsers.
function showFlipperControls() {
  const supported = "bluetooth" in navigator;
  document.getElementById("flipper").hidden = !supported;
  document.getElementById("flipper-unsupported").hidden = supported;
}

document.getElementById("flipper-connect").addEventListener("click", async () => {
  let device;
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: FLIPPER_NAME_PREFIX }],
      optionalServices: [FLIPPER_SERVICE],
    });
  } catch (_) {
    return; // The chooser was dismissed.
  }
  if (flipper.device && flipper.device !== device && flipper.device.gatt.connected) {
    flipper.device.gatt.disconnect();
  }
  flipper.device = device;
  flipper.backoff = 1000;
  device.ongattserverdisconnected = (event) => {
    if (event.target !== flipper.device) return;
    flipper.rx = null;
    setFlipperLink("lost");
    if (flipper.creditArrived) flipper.creditArrived();
    retryFlipperLater();
  };
  linkFlipper();
});

async function linkFlipper() {
  const device = flipper.device;
  setFlipperLink("connecting");
  try {
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(FLIPPER_SERVICE);
    const [rx, tx, flow] = await Promise.all(
      [FLIPPER_RX, FLIPPER_TX, FLIPPER_FLOW].map((uuid) => service.getCharacteristic(uuid)),
    );
    flipper.credit = Infinity;
    try {
      flow.oncharacteristicvaluechanged = (event) => {
        flipper.credit = event.target.value.getUint32(0);
        if (flipper.creditArrived) flipper.creditArrived();
      };
      await flow.startNotifications();
      flipper.credit = (await flow.readValue()).getUint32(0);
    } catch (_) {
      flipper.credit = Infinity; // No flow control published: write freely.
    }
    tx.oncharacteristicvaluechanged = (event) => {
      const value = event.target.value;
      for (const byte of new Uint8Array(value.buffer, value.byteOffset, value.byteLength)) {
        if (byte <= 4) send(byte, "flipper");
      }
    };
    await tx.startNotifications();
    if (device !== flipper.device) return;
    flipper.rx = rx;
    flipper.chunk = FLIPPER_CHUNK;
    flipper.backoff = 1000;
    setFlipperLink("connected");
    showOnFlipper({ ...flipperScreen, started: false });
  } catch (_) {
    if (device !== flipper.device) return;
    setFlipperLink("lost");
    retryFlipperLater();
  }
}

function retryFlipperLater() {
  if (flipper.retry) return;
  flipper.retry = setTimeout(() => {
    flipper.retry = null;
    linkFlipper();
  }, flipper.backoff);
  flipper.backoff = Math.min(flipper.backoff * 2, 16000);
}

function setFlipperLink(link) {
  flipper.link = link;
  const el = document.getElementById("flipper-link");
  el.dataset.link = link;
  el.textContent = "Flipper: " + link;
  showArmHint();
}

// Records what the Flipper should show and sends it. Only the newest frame waits to be sent:
// a frame produced while another is being written replaces any frame still waiting.
function showOnFlipper(screen) {
  flipperScreen = screen;
  if (flipper.link !== "connected") return;
  flipper.newestFrame = encodeFlipperFrame(screen, currentMode, !serverOnline);
  if (!flipper.writing) writeNewestFrames();
}

async function writeNewestFrames() {
  flipper.writing = true;
  try {
    while (flipper.newestFrame && flipper.rx) {
      const frame = flipper.newestFrame;
      flipper.newestFrame = null;
      await writeFrame(frame);
    }
  } catch (_) {
    // The link dropped mid-frame; reconnecting resends the current screen.
  }
  flipper.writing = false;
}

// One write in flight at a time, each within the chunk size and the Flipper's remaining buffer.
async function writeFrame(frame) {
  let offset = 0;
  while (offset < frame.length) {
    if (flipper.credit === 0) {
      await new Promise((resolve) => {
        flipper.creditArrived = () => {
          flipper.creditArrived = null;
          resolve();
        };
      });
    }
    const rx = flipper.rx;
    if (!rx) throw new Error("Flipper link lost");
    const size = Math.min(flipper.chunk, flipper.credit, frame.length - offset);
    const chunk = frame.subarray(offset, offset + size);
    try {
      if (rx.properties.writeWithoutResponse) {
        await rx.writeValueWithoutResponse(chunk);
      } else {
        await rx.writeValueWithResponse(chunk);
      }
    } catch (error) {
      if (size > FLIPPER_SMALL_CHUNK) {
        flipper.chunk = FLIPPER_SMALL_CHUNK;
        continue;
      }
      throw error;
    }
    flipper.credit -= size;
    offset += size;
  }
}

// `screen`: { state (null = no game), started, over, holdMs }.
function encodeFlipperFrame(screen, mode, offline) {
  const state = screen.state;
  const board = state && state.board;
  const fits = board && board.width <= 25 && board.height <= 25;
  const width = fits ? board.width : 0;
  const height = fits ? board.height : 0;
  const cells = new Uint8Array(width * height);
  const place = (p, code) => {
    if (p.x < 0 || p.y < 0 || p.x >= width || p.y >= height) return;
    const i = (height - 1 - p.y) * width + p.x;
    if (CELL_RANK[code] > CELL_RANK[cells[i]]) cells[i] = code;
  };
  if (fits) {
    for (const h of board.hazards || []) place(h, CELL.hazard);
    for (const f of board.food || []) place(f, CELL.food);
    for (const snake of board.snakes || []) {
      const mine = snake.id === state.you.id;
      for (const p of snake.body) place(p, mine ? CELL.myBody : CELL.otherBody);
      place(snake.head, mine ? CELL.myHead : CELL.otherHead);
    }
  }
  const you = state ? state.you : null;
  const turn = state ? state.turn & 0xffff : 0;
  const payload = new Uint8Array(8 + Math.ceil(cells.length / 2));
  payload[0] =
    (screen.started ? 1 : 0) |
    (screen.over ? 2 : 0) |
    (state ? 0 : 4) |
    (board && !fits ? 8 : 0) |
    ((MODE_BITS[mode] ?? 0) << 4) |
    (offline ? 64 : 0);
  payload[1] = width;
  payload[2] = height;
  payload[3] = turn & 0xff;
  payload[4] = turn >> 8;
  payload[5] = you ? Math.min(255, Math.max(0, you.health)) : 0;
  payload[6] = you ? Math.min(255, you.length ?? you.body.length) : 0;
  payload[7] = Math.min(255, Math.floor((screen.holdMs || 0) / 10));
  cells.forEach((code, i) => {
    payload[8 + (i >> 1)] |= i % 2 === 0 ? code << 4 : code;
  });
  const frame = new Uint8Array(3 + payload.length);
  frame[0] = 0x53;
  frame[1] = payload.length & 0xff;
  frame[2] = payload.length >> 8;
  frame.set(payload, 3);
  return frame;
}

// ---- screen wake lock ---------------------------------------------------------

async function holdWakeLock() {
  if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
  try {
    await navigator.wakeLock.request("screen");
  } catch (_) {
    // Not granted (low battery, unsupported context); the page still works.
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    holdWakeLock();
    keyField.focus({ preventScroll: true });
  }
  showArmHint();
});

holdWakeLock();
keyField.focus({ preventScroll: true });
showArmHint();
showFlipperControls();
connect();
</script>
